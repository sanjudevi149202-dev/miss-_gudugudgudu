<!DOCTYPE html>
<html>
<head>
    <title>For Gopika 💖</title>

    <style>
        body {
            margin: 0;
            font-family: 'Georgia', serif;
            text-align: center;
            background: linear-gradient(to right, #ffdde1, #ee9ca7);
            color: #333;
        }

        .container {
            padding-top: 40px;
        }

        h1 {
            font-size: 38px;
        }

        .photos {
            margin: 20px 0;
        }

        .photos img {
            width: 160px;  /* smaller size */
            margin: 8px;
            border-radius: 18px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
            transition: 0.4s;
        }

        .photos img:hover {
            transform: scale(1.05);
        }

        p {
            font-size: 18px;
            width: 75%;
            margin: auto;
            line-height: 1.6;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            margin: 15px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
        }

        .yes {
            background-color: #ff4d6d;
            color: white;
        }

        .no {
            background-color: #555;
            color: white;
            position: relative;
        }

        .hidden {
            display: none;
        }

        .confirmation {
            padding-top: 120px;
        }

        .heart {
            position: fixed;
            animation: float 3s linear forwards;
        }

        @keyframes float {
            0% { transform: translateY(0px); opacity: 1; }
            100% { transform: translateY(-600px); opacity: 0; }
        }
    </style>
</head>

<body>

<div class="container" id="mainPage">

    <h1>Gopika 💖</h1>

    <div class="photos">
        <img src="her_beauty.jpg">
        <img src="moments.jpg">
    </div>

    <p>
        I reached one simple conclusion...
        <br><br>
        I want to take you for lunch 🍽️✨
        <br><br>
        Just us. Your smile. My treat.
        <br><br>
        Will you join me?
    </p>

    <button class="yes" onclick="accept()">Yes 💗</button>
    <button class="no" onmouseover="runAway(this)">No 🙈</button>

</div>

<div class="confirmation hidden" id="confirmPage">
    <h1>💌 Reservation Confirmed 💌</h1>
    <h2>For Miss Gopika ✨</h2>
    <p>
        Table for two.  
        A soft afternoon.  
        And a memory waiting to happen.
    </p>
</div>

<script>
    function runAway(button) {
        button.style.position = "absolute";
        button.style.top = Math.random() * (window.innerHeight - 100) + "px";
        button.style.left = Math.random() * (window.innerWidth - 100) + "px";
    }

    function accept() {
        document.getElementById("mainPage").classList.add("hidden");
        document.getElementById("confirmPage").classList.remove("hidden");

        for (let i = 0; i < 60; i++) {
            let heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = "💖";
            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.top = window.innerHeight + "px";
            heart.style.fontSize = (Math.random() * 20 + 20) + "px";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 3000);
        }
    }
</script>

</body>
</html>
